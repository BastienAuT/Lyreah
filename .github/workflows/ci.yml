name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://build:build@localhost/build
      NEON_AUTH_BASE_URL: https://auth.invalid
      NEON_AUTH_COOKIE_SECRET: build-only-cookie-secret-at-least-32-characters
      SUPABASE_URL: https://storage.invalid
      SUPABASE_SERVICE_ROLE_KEY: build-only
      SUPABASE_STORAGE_BUCKET: lyreah
      SUPABASE_STORAGE_PREFIX: ci
      NEXT_PUBLIC_SUPABASE_URL: https://storage.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        # Drizzle Kit is a development-only CLI. Its pinned esbuild advisory only
        # concerns an exposed development server; no such server ships with Lyreah.
        run: bun audit --ignore GHSA-67mh-4wv8-2f99
      - run: bun run test
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  e2e:
    if: ${{ vars.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_SIGNUP_EMAIL: ${{ secrets.E2E_SIGNUP_EMAIL }}
      E2E_SIGNUP_PASSWORD: ${{ secrets.E2E_SIGNUP_PASSWORD }}
      E2E_VERCEL_PROTECTION_BYPASS: ${{ secrets.E2E_VERCEL_PROTECTION_BYPASS }}
      E2E_READER_STATE_B64: ${{ secrets.E2E_READER_STORAGE_STATE_B64 }}
      E2E_ADMIN_STATE_B64: ${{ secrets.E2E_ADMIN_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - name: Restore reader session
        if: ${{ env.E2E_READER_STATE_B64 != '' }}
        run: |
          mkdir -p tests/.auth
          printf '%s' "$E2E_READER_STATE_B64" | base64 --decode > tests/.auth/reader.json
          echo "E2E_READER_STORAGE_STATE=tests/.auth/reader.json" >> "$GITHUB_ENV"
      - name: Restore admin session
        if: ${{ env.E2E_ADMIN_STATE_B64 != '' }}
        run: |
          mkdir -p tests/.auth
          printf '%s' "$E2E_ADMIN_STATE_B64" | base64 --decode > tests/.auth/admin.json
          echo "E2E_ADMIN_STORAGE_STATE=tests/.auth/admin.json" >> "$GITHUB_ENV"
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
